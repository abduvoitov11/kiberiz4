<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#0052d4"/>
    </linearGradient>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#43e97b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" rx="40" fill="url(#bgGrad)"/>
  
  <!-- Cyber Grid Lines -->
  <g stroke="#1a253c" stroke-width="1.5" opacity="0.6">
    <line x1="100" y1="0" x2="100" y2="800"/>
    <line x1="200" y1="0" x2="200" y2="800"/>
    <line x1="300" y1="0" x2="300" y2="800"/>
    <line x1="400" y1="0" x2="400" y2="800"/>
    <line x1="500" y1="0" x2="500" y2="800"/>
    <line x1="600" y1="0" x2="600" y2="800"/>
    <line x1="700" y1="0" x2="700" y2="800"/>
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="0" y1="500" x2="800" y2="500"/>
    <line x1="0" y1="600" x2="800" y2="600"/>
    <line x1="0" y1="700" x2="800" y2="700"/>
  </g>

  <!-- Outer Cyber Circuit Rings -->
  <circle cx="400" cy="360" r="260" fill="none" stroke="#00f2fe" stroke-width="2" stroke-dasharray="15 25" opacity="0.4"/>
  <circle cx="400" cy="360" r="240" fill="none" stroke="#43e97b" stroke-width="1.5" stroke-dasharray="40 10 10 10" opacity="0.3"/>

  <!-- Shield Shape -->
  <path d="M 400 140 
           Q 560 160 560 300 
           Q 560 480 400 580 
           Q 240 480 240 300 
           Q 240 160 400 140 Z" 
        fill="#0b172a" 
        stroke="url(#shieldGrad)" 
        stroke-width="8" 
        filter="url(#glow)"/>

  <!-- Fingerprint Curves inside Shield -->
  <g fill="none" stroke="url(#neonGrad)" stroke-width="5" stroke-linecap="round" opacity="0.85">
    <!-- Loop 1 -->
    <path d="M 370 290 Q 400 260 430 290 Q 440 330 420 370 Q 400 410 380 450" />
    <!-- Loop 2 -->
    <path d="M 350 280 Q 400 230 450 280 Q 465 330 440 390 Q 420 440 390 480" />
    <!-- Loop 3 -->
    <path d="M 330 290 Q 400 200 470 290 Q 485 360 455 420 Q 430 470 395 510" />
    <!-- Loop 4 Inner Core -->
    <path d="M 390 320 Q 400 300 410 320 Q 415 350 400 380 Q 390 400 385 430" />
    <!-- Scanner target lines -->
    <line x1="280" y1="360" x2="330" y2="360" stroke="#00f2fe" stroke-width="4"/>
    <line x1="470" y1="360" x2="520" y2="360" stroke="#00f2fe" stroke-width="4"/>
    <circle cx="400" cy="360" r="14" fill="#00f2fe" filter="url(#glow)"/>
    <circle cx="400" cy="360" r="6" fill="#ffffff"/>
  </g>

  <!-- Brand Typography -->
  <text x="400" y="660" font-family="DejaVu Sans, Arial, sans-serif" font-size="52" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4">KIBER<tspan fill="#00f2fe">IZ-4</tspan></text>
  <text x="400" y="705" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="bold" fill="#43e97b" text-anchor="middle" letter-spacing="6">RAQAMLI IZ VA PROFIL AUDITI</text>
  <text x="400" y="735" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" fill="#8ca0ba" text-anchor="middle">4-sonli umumtaʼlim maktabi maxsus loyihasi</text>
</svg>
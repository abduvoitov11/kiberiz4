services:
  # 1. Background Worker (agar pullik yoki Starter reja tanlansa)
  - type: worker
    name: kiberiz4-bot-worker
    runtime: python
    buildCommand: pip install -r bot/requirements.txt
    startCommand: python bot/bot.py
    envVars:
      - key: BOT_TOKEN
        sync: false

  # 2. Web Service (100% BEPUL Free plan uchun)
  - type: web
    name: kiberiz4-bot-free
    runtime: python
    plan: free
    buildCommand: pip install -r bot/requirements.txt
    startCommand: python bot/bot.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: PORT
        value: 10000
